services:
  task-orchestrator:
    build: .
    ports:
      - "${HTTP_PORT:-2727}:2727"
    environment:
      - RMF2_TO__HTTP__HOST=0.0.0.0
      - RMF2_TO__AMQP__HOST=${AMQP_HOST:-rabbitmq}
      - RMF2_TO__AMQP__PORT=${AMQP_PORT:-5672}
      - RMF2_TO__MQTT__HOST=${MQTT_HOST:-mosquitto}
      - RMF2_TO__MQTT__PORT=${MQTT_PORT:-1883}
      - RUST_LOG=${LOG_LEVEL:-rmf2_task_orchestrator=info}
      - RMF2_TO__GRPC__CA_CERT
      - RMF2_TO__DATABASE__URL=postgres://rmf2:rmf2@postgres:5432/rmf2_task_orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./assets/certs:/app/assets/certs:ro
    restart: unless-stopped

  rabbitmq:
    profiles: [local]
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=rmf2
      - POSTGRES_PASSWORD=rmf2
      - POSTGRES_DB=rmf2_task_orchestrator
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmf2 -d rmf2_task_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    profiles: [local]
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto-config
        target: /mosquitto/config/mosquitto.conf

volumes:
  pgdata:

configs:
  mosquitto-config:
    content: |
      listener 1883
      allow_anonymous true
