name: setup
description: Install Rust, protoc, pnpm, and node

runs:
  using: composite
  steps:
    # rtolnay/rust-toolchain does NOT use conventional versioning
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 17-07-2026 release, up to rustc v1.97.1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install protoc
      shell: bash
      run: |
        sudo apt-get update -qq -y
        sudo apt-get install protobuf-compiler -qq -y

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: true

    # Crossflow frontend runs install
    - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        version: 11
        runtime: node@22
        install: false
