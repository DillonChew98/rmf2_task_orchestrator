/* Running / design queue operations. Payload shapes are JSON objects. */
service QueueManagement {
  /* GET /queue/experiments. Request.Payload is ListQueueExperimentsRequestPayload; Result.Payload is ListQueueExperimentsResult. */
  rpc ListQueueExperiments (sila2.org.tainstruments.sdt.queuemanagement.v2.ListQueueExperiments_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.ListQueueExperiments_Responses) {}
