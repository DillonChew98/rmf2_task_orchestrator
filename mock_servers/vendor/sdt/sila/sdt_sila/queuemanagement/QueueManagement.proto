  /* GET /queue/validate. Request.Payload is ValidateQueueJsonRequestPayload; Result.Payload is ValidateQueueJsonResult. */
  rpc ValidateQueueJson (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateQueueJson_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateQueueJson_Responses) {}
  /* POST /queue/experiments/from-sequence. Request.Payload is AddExperimentsFromSequenceRequestPayload; Result.Payload is AddExperimentsFromSequenceResult. */
  rpc AddExperimentsFromSequence (sila2.org.tainstruments.sdt.queuemanagement.v2.AddExperimentsFromSequence_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.AddExperimentsFromSequence_Responses) {}
  /* POST /queue/experiments/validate. Request.Payload is ValidateExperimentPayloadRequestPayload; Result.Payload is ValidateExperimentPayloadResult. */
  rpc ValidateExperimentPayload (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateExperimentPayload_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateExperimentPayload_Responses) {}
  /* POST /queue/experiments/new. Request.Payload is AddNewExperimentsRequestPayload; Result.Payload is AddNewExperimentsResult. */
  rpc AddNewExperiments (sila2.org.tainstruments.sdt.queuemanagement.v2.AddNewExperiments_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.AddNewExperiments_Responses) {}
  /* POST /queue/experiments/copy. Request.Payload is CopyExperimentToQueueRequestPayload; Result.Payload is CopyExperimentToQueueResult. */
  rpc CopyExperimentToQueue (sila2.org.tainstruments.sdt.queuemanagement.v2.CopyExperimentToQueue_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.CopyExperimentToQueue_Responses) {}
  /* GET /queue/experiments/{id}. Request.Payload is GetExperimentDetailsRequestPayload; Result.Payload is GetExperimentDetailsResult. */
  rpc GetExperimentDetails (sila2.org.tainstruments.sdt.queuemanagement.v2.GetExperimentDetails_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.GetExperimentDetails_Responses) {}
  /* PATCH /queue/experiments/{id}. Request.Payload is ModifyExperimentInQueueRequestPayload; Result.Payload is ModifyExperimentInQueueResult. */
  rpc ModifyExperimentInQueue (sila2.org.tainstruments.sdt.queuemanagement.v2.ModifyExperimentInQueue_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.ModifyExperimentInQueue_Responses) {}
  /* DELETE /queue/experiments/{id}. Request.Payload is RemoveExperimentFromQueueRequestPayload; Result.Payload is RemoveExperimentFromQueueResult. */
  rpc RemoveExperimentFromQueue (sila2.org.tainstruments.sdt.queuemanagement.v2.RemoveExperimentFromQueue_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.RemoveExperimentFromQueue_Responses) {}
  /* PUT /queue/experiments/{id}/position. Request.Payload is MoveExperimentInQueueRequestPayload; Result.Payload is MoveExperimentInQueueResult. */
  rpc MoveExperimentInQueue (sila2.org.tainstruments.sdt.queuemanagement.v2.MoveExperimentInQueue_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.MoveExperimentInQueue_Responses) {}
  /* GET /queue/experiments/{id}/validate. Request.Payload is ValidateQueuedExperimentRequestPayload; Result.Payload is ValidateQueuedExperimentResult. */
  rpc ValidateQueuedExperiment (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateQueuedExperiment_Parameters) returns (sila2.org.tainstruments.sdt.queuemanagement.v2.ValidateQueuedExperiment_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.org.tainstruments.sdt.queuemanagement.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.org.tainstruments.sdt.queuemanagement.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

