  /* DELETE /reference-pans/{panNumber}. Request.Payload is DeleteReferencePanRequestPayload; Result.Payload is DeleteReferencePanResult. */
  rpc DeleteReferencePan (sila2.org.tainstruments.xdsc.referencepansmanagement.v2.DeleteReferencePan_Parameters) returns (sila2.org.tainstruments.xdsc.referencepansmanagement.v2.DeleteReferencePan_Responses) {}
}

