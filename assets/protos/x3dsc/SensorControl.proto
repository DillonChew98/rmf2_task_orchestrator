syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.tainstruments.xdsc.sensorcontrol.v2;

/* Get and set which of the three X3 measurement sensors (A, B, C) are enabled. */
service SensorControl {
  /* PUT /sensors. Request.Payload is SetSensorsRequestPayload (Body: useSensorA, useSensorB, useSensorC). At least one sensor must remain enabled. Result.Payload is SetSensorsResult. */
  rpc SetSensors (sila2.org.tainstruments.xdsc.sensorcontrol.v2.SetSensors_Parameters) returns (sila2.org.tainstruments.xdsc.sensorcontrol.v2.SetSensors_Responses) {}
  /* GET /sensors body as UTF-8 JSON. Reports which of the three X3 measurement sensors (A, B, C) are enabled. */
  rpc Get_CurrentSensorsJson (sila2.org.tainstruments.xdsc.sensorcontrol.v2.Get_CurrentSensorsJson_Parameters) returns (sila2.org.tainstruments.xdsc.sensorcontrol.v2.Get_CurrentSensorsJson_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

/* SetSensors Request.Payload. Body holds useSensorA/B/C booleans. */
message DataType_SetSensorsRequestPayload {
  message SetSensorsRequestPayload_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON body. Void or empty object means none. When --payload-json omits Body, remaining keys are treated as the body. */
  }
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_SetSensorsRequestPayload.SetSensorsRequestPayload_Struct SetSensorsRequestPayload = 1;  /* SetSensors Request.Payload. Body holds useSensorA/B/C booleans. */
}

/* SetSensors Result.Payload. */
message DataType_SetSensorsResult {
  message SetSensorsResult_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON response (or status snapshot). */
  }
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_SetSensorsResult.SetSensorsResult_Struct SetSensorsResult = 1;  /* SetSensors Result.Payload. */
}

/* Parameters for SetSensors */
message SetSensors_Parameters {
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_Request Request = 1;  /* Standard command request. */
}

/* Responses of SetSensors */
message SetSensors_Responses {
  sila2.org.tainstruments.xdsc.sensorcontrol.v2.DataType_Envelope Result = 1;  /* Standard command envelope. */
}

/* Parameters for CurrentSensorsJson */
message Get_CurrentSensorsJson_Parameters {
}

/* Responses of CurrentSensorsJson */
message Get_CurrentSensorsJson_Responses {
  sila2.org.silastandard.String CurrentSensorsJson = 1;  /* GET /sensors body as UTF-8 JSON. Reports which of the three X3 measurement sensors (A, B, C) are enabled. */
}
