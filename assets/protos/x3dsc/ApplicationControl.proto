  sila2.org.tainstruments.xdsc.applicationcontrol.v2.DataType_SetUiEnabledRequestPayload.SetUiEnabledRequestPayload_Struct SetUiEnabledRequestPayload = 1;  /* SetUiEnabled Request.Payload. */
