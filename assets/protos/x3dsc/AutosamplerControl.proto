syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.tainstruments.xdsc.autosamplercontrol.v2;

/* X3 DSC autosampler motion, lid, and configuration. */
service AutosamplerControl {
  /* GET /autosampler/settings. Result.Payload is GetAutosamplerSettingsJsonResult. */
  rpc GetAutosamplerSettingsJson (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.GetAutosamplerSettingsJson_Parameters) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.GetAutosamplerSettingsJson_Responses) {}
  /* PUT /autosampler/settings. Request.Payload is UpdateAutosamplerSettingsRequestPayload; Result.Payload is UpdateAutosamplerSettingsResult. */
  rpc UpdateAutosamplerSettings (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UpdateAutosamplerSettings_Parameters) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UpdateAutosamplerSettings_Responses) {}
  /* POST /autosampler/load-sample. Request.Payload is LoadSamplePanRequestPayload. Update Payload is AutosamplerProgress; Result.Payload is LoadSamplePanResult. */
  rpc LoadSamplePan (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadSamplePan_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of LoadSamplePan */
  rpc LoadSamplePan_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of LoadSamplePan */
  rpc LoadSamplePan_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadSamplePan_IntermediateResponses) {}
  /* Retrieve result of LoadSamplePan */
  rpc LoadSamplePan_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadSamplePan_Responses) {}
  /* POST /autosampler/unload-sample. Request.Payload is UnloadSamplePanRequestPayload (empty Body unloads all sensors). Update Payload is AutosamplerProgress; Result.Payload is UnloadSamplePanResult. */
  rpc UnloadSamplePan (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadSamplePan_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of UnloadSamplePan */
  rpc UnloadSamplePan_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of UnloadSamplePan */
  rpc UnloadSamplePan_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadSamplePan_IntermediateResponses) {}
  /* Retrieve result of UnloadSamplePan */
  rpc UnloadSamplePan_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadSamplePan_Responses) {}
  /* POST /autosampler/load-reference. Request.Payload is LoadReferencePanRequestPayload. Update Payload is AutosamplerProgress; Result.Payload is LoadReferencePanResult. */
  rpc LoadReferencePan (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadReferencePan_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of LoadReferencePan */
  rpc LoadReferencePan_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of LoadReferencePan */
  rpc LoadReferencePan_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadReferencePan_IntermediateResponses) {}
  /* Retrieve result of LoadReferencePan */
  rpc LoadReferencePan_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.LoadReferencePan_Responses) {}
  /* POST /autosampler/unload-reference. Void request Payload. Update Payload is AutosamplerProgress; Result.Payload is UnloadReferencePanResult. */
  rpc UnloadReferencePan (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadReferencePan_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of UnloadReferencePan */
  rpc UnloadReferencePan_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of UnloadReferencePan */
  rpc UnloadReferencePan_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadReferencePan_IntermediateResponses) {}
  /* Retrieve result of UnloadReferencePan */
  rpc UnloadReferencePan_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.UnloadReferencePan_Responses) {}
  /* POST /autosampler/park. Request.Payload is ParkAutosamplerRequestPayload (Position CellSide or TraySide). Update Payload is AutosamplerProgress; Result.Payload is ParkAutosamplerResult. */
  rpc ParkAutosampler (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.ParkAutosampler_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of ParkAutosampler */
  rpc ParkAutosampler_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of ParkAutosampler */
  rpc ParkAutosampler_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.ParkAutosampler_IntermediateResponses) {}
  /* Retrieve result of ParkAutosampler */
  rpc ParkAutosampler_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.ParkAutosampler_Responses) {}
  /* POST /autosampler/open-lid. Void request Payload. Update Payload is AutosamplerProgress; Result.Payload is OpenAutosamplerLidResult. */
  rpc OpenAutosamplerLid (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.OpenAutosamplerLid_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of OpenAutosamplerLid */
  rpc OpenAutosamplerLid_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of OpenAutosamplerLid */
  rpc OpenAutosamplerLid_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.OpenAutosamplerLid_IntermediateResponses) {}
  /* Retrieve result of OpenAutosamplerLid */
  rpc OpenAutosamplerLid_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.OpenAutosamplerLid_Responses) {}
  /* POST /autosampler/close-lid. Void request Payload. Update Payload is AutosamplerProgress; Result.Payload is CloseAutosamplerLidResult. */
  rpc CloseAutosamplerLid (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.CloseAutosamplerLid_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of CloseAutosamplerLid */
  rpc CloseAutosamplerLid_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve intermediate responses of CloseAutosamplerLid */
  rpc CloseAutosamplerLid_Intermediate (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.CloseAutosamplerLid_IntermediateResponses) {}
  /* Retrieve result of CloseAutosamplerLid */
  rpc CloseAutosamplerLid_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.CloseAutosamplerLid_Responses) {}
  /* GET /autosampler/status body as UTF-8 JSON. Subscribeable; Get returns a live snapshot. */
  rpc Subscribe_CurrentAutosamplerStatus (sila2.org.tainstruments.xdsc.autosamplercontrol.v2.Subscribe_CurrentAutosamplerStatus_Parameters) returns (stream sila2.org.tainstruments.xdsc.autosamplercontrol.v2.Subscribe_CurrentAutosamplerStatus_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.org.tainstruments.xdsc.autosamplercontrol.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.org.tainstruments.xdsc.autosamplercontrol.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

