syntax = "proto3";

import "SiLAFramework.proto";

package sila2.com.bruker.ftir.instrumentsettings.v2;

/* Subscribeable OPUS connection snapshot: connected flag, OPUS version, extended version, host IP, and UI language. */
service InstrumentSettings {
  /* Live OPUS connection snapshot (connected, versions, host IP, language). Get is live; Subscribe is per-client. */
  rpc Subscribe_CurrentInstrumentSettings (sila2.com.bruker.ftir.instrumentsettings.v2.Subscribe_CurrentInstrumentSettings_Parameters) returns (stream sila2.com.bruker.ftir.instrumentsettings.v2.Subscribe_CurrentInstrumentSettings_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.com.bruker.ftir.instrumentsettings.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.com.bruker.ftir.instrumentsettings.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

/* Point-in-time OPUS / FTIR connection snapshot. */
message DataType_InstrumentSettings {
  message InstrumentSettings_Struct {
    sila2.org.silastandard.Boolean Connected = 1;  /* Whether a working OPUS HTTP session is established. */
    sila2.org.silastandard.String OpusVersion = 2;  /* OPUS version string, e.g. "9.2". */
    sila2.org.silastandard.String OpusVersionExt = 3;  /* Extended OPUS version string with build details. */
    sila2.org.silastandard.String HostIp = 4;  /* IP address of the OPUS host as reported by OPUS. */
    sila2.org.silastandard.String Language = 5;  /* OPUS UI language, e.g. "English". */
  }
  sila2.com.bruker.ftir.instrumentsettings.v2.DataType_InstrumentSettings.InstrumentSettings_Struct InstrumentSettings = 1;  /* Point-in-time OPUS / FTIR connection snapshot. */
}

/* Parameters for CurrentInstrumentSettings */
message Subscribe_CurrentInstrumentSettings_Parameters {
}

/* Responses of CurrentInstrumentSettings */
message Subscribe_CurrentInstrumentSettings_Responses {
  sila2.com.bruker.ftir.instrumentsettings.v2.DataType_InstrumentSettings CurrentInstrumentSettings = 1;  /* Live OPUS connection snapshot (connected, versions, host IP, language). Get is live; Subscribe is per-client. */
}
