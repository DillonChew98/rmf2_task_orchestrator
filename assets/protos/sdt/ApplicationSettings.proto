  rpc SetLimsSettings (sila2.org.tainstruments.sdt.applicationsettings.v2.SetLimsSettings_Parameters) returns (sila2.org.tainstruments.sdt.applicationsettings.v2.SetLimsSettings_Responses) {}
  /* GET /app/settings/user. Result.Payload is GetUserSettingsResult. */
  rpc GetUserSettings (sila2.org.tainstruments.sdt.applicationsettings.v2.GetUserSettings_Parameters) returns (sila2.org.tainstruments.sdt.applicationsettings.v2.GetUserSettings_Responses) {}
  /* PUT /app/settings/user. Request.Payload is SetUserSettingsRequestPayload; Result.Payload is SetUserSettingsResult. */
  rpc SetUserSettings (sila2.org.tainstruments.sdt.applicationsettings.v2.SetUserSettings_Parameters) returns (sila2.org.tainstruments.sdt.applicationsettings.v2.SetUserSettings_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
