  /* GET /app/settings/lims. Result.Payload is GetLimsSettingsResult. */
  rpc GetLimsSettings (sila2.org.tainstruments.sdt.applicationsettings.v2.GetLimsSettings_Parameters) returns (sila2.org.tainstruments.sdt.applicationsettings.v2.GetLimsSettings_Responses) {}
