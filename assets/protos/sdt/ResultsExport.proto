syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.tainstruments.sdt.resultsexport.v2;

/* Export .tri files to JSON and poll async jobs. */
service ResultsExport {
  /* POST /results/export-json. Request.Payload is ExportResultsJsonRequestPayload; Result.Payload is ExportResultsJsonResult. */
  rpc ExportResultsJson (sila2.org.tainstruments.sdt.resultsexport.v2.ExportResultsJson_Parameters) returns (sila2.org.tainstruments.sdt.resultsexport.v2.ExportResultsJson_Responses) {}
  /* GET /results/export-json/jobs/{jobId}. Request.Payload is GetExportJsonJobRequestPayload; Result.Payload is GetExportJsonJobResult. */
  rpc GetExportJsonJob (sila2.org.tainstruments.sdt.resultsexport.v2.GetExportJsonJob_Parameters) returns (sila2.org.tainstruments.sdt.resultsexport.v2.GetExportJsonJob_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

/* ExportResultsJson Request.Payload. */
message DataType_ExportResultsJsonRequestPayload {
  message ExportResultsJsonRequestPayload_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON body. Void or empty object means none. When --payload-json omits Body, remaining keys are treated as the body. */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_ExportResultsJsonRequestPayload.ExportResultsJsonRequestPayload_Struct ExportResultsJsonRequestPayload = 1;  /* ExportResultsJson Request.Payload. */
}

/* ExportResultsJson Result.Payload. */
message DataType_ExportResultsJsonResult {
  message ExportResultsJsonResult_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON response (or status snapshot). */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_ExportResultsJsonResult.ExportResultsJsonResult_Struct ExportResultsJsonResult = 1;  /* ExportResultsJson Result.Payload. */
}

/* GetExportJsonJob Request.Payload. */
message DataType_GetExportJsonJobRequestPayload {
  message GetExportJsonJobRequestPayload_Struct {
    sila2.org.silastandard.String JobId = 1;  /* Async export job identifier. */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_GetExportJsonJobRequestPayload.GetExportJsonJobRequestPayload_Struct GetExportJsonJobRequestPayload = 1;  /* GetExportJsonJob Request.Payload. */
}

/* GetExportJsonJob Result.Payload. */
message DataType_GetExportJsonJobResult {
  message GetExportJsonJobResult_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON response (or status snapshot). */
  }
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_GetExportJsonJobResult.GetExportJsonJobResult_Struct GetExportJsonJobResult = 1;  /* GetExportJsonJob Result.Payload. */
}

/* Parameters for ExportResultsJson */
message ExportResultsJson_Parameters {
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Request Request = 1;  /* Standard command request. */
}

/* Responses of ExportResultsJson */
message ExportResultsJson_Responses {
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Envelope Result = 1;  /* Standard command envelope. */
}

/* Parameters for GetExportJsonJob */
message GetExportJsonJob_Parameters {
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Request Request = 1;  /* Standard command request. */
}

/* Responses of GetExportJsonJob */
message GetExportJsonJob_Responses {
  sila2.org.tainstruments.sdt.resultsexport.v2.DataType_Envelope Result = 1;  /* Standard command envelope. */
}
