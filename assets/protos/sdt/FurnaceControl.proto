syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.tainstruments.sdt.furnacecontrol.v2;

/* Furnace motion and status. */
service FurnaceControl {
  /* POST /furnace/open. Void request Payload; Result.Payload is OpenFurnaceResult. */
  rpc OpenFurnace (sila2.org.tainstruments.sdt.furnacecontrol.v2.OpenFurnace_Parameters) returns (sila2.org.tainstruments.sdt.furnacecontrol.v2.OpenFurnace_Responses) {}
  /* POST /furnace/close. Void request Payload; Result.Payload is CloseFurnaceResult. */
  rpc CloseFurnace (sila2.org.tainstruments.sdt.furnacecontrol.v2.CloseFurnace_Parameters) returns (sila2.org.tainstruments.sdt.furnacecontrol.v2.CloseFurnace_Responses) {}
  /* GET /furnace/status body as UTF-8 JSON. Subscribeable; Get returns a live snapshot. */
  rpc Subscribe_CurrentFurnaceStatus (sila2.org.tainstruments.sdt.furnacecontrol.v2.Subscribe_CurrentFurnaceStatus_Parameters) returns (stream sila2.org.tainstruments.sdt.furnacecontrol.v2.Subscribe_CurrentFurnaceStatus_Responses) {}
}

/* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
message DataType_Request {
  message Request_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String CorrelationId = 2;  /* Caller correlation id. Empty means none. Echoed on the response. */
    sila2.org.silastandard.Integer TimeoutSeconds = 3;  /* Command timeout in seconds. 0 means the server default. */
    sila2.org.silastandard.String Payload = 4;  /* UTF-8 JSON string for the request body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
  }
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Request.Request_Struct Request = 1;  /* Standard command request. Version is the envelope schema version. Empty CorrelationId means none. TimeoutSeconds 0 means the server default. Empty Payload means none. */
}

/* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
message DataType_Envelope {
  message Envelope_Struct {
    sila2.org.silastandard.Integer Version = 1;  /* Envelope schema version. Currently 2. */
    sila2.org.silastandard.String Outcome = 2;  /* Succeeded, Failed, Rejected, or Running. */
    sila2.org.silastandard.String Code = 3;  /* Additive lowercase dotted code on Failed/Rejected. 0 on Succeeded. Empty on Running. */
    sila2.org.silastandard.String Message = 4;  /* Human-readable outcome message. Defaults to success on Succeeded. */
    sila2.org.silastandard.String CorrelationId = 5;  /* Echo of the request correlation id. Empty means none. */
    sila2.org.silastandard.String Payload = 6;  /* UTF-8 JSON string for the result body. Empty string means none. Prefer a JSON object matching the command DataTypeDefinition. */
    sila2.org.silastandard.String Details = 7;  /* UTF-8 JSON string for diagnostics such as status_code, url, and canForce. Empty string means none. */
  }
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Envelope.Envelope_Struct Envelope = 1;  /* Standard command result. Outcome is Succeeded, Failed, Rejected, or Running. Code is 0 on Succeeded and empty on Running. Message defaults to success on Succeeded. Empty Details means none. */
}

/* OpenFurnace Result.Payload. */
message DataType_OpenFurnaceResult {
  message OpenFurnaceResult_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON response (or status snapshot). */
  }
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_OpenFurnaceResult.OpenFurnaceResult_Struct OpenFurnaceResult = 1;  /* OpenFurnace Result.Payload. */
}

/* CloseFurnace Result.Payload. */
message DataType_CloseFurnaceResult {
  message CloseFurnaceResult_Struct {
    sila2.org.silastandard.Any Body = 1;  /* Opaque TRIOS REST JSON response (or status snapshot). */
  }
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_CloseFurnaceResult.CloseFurnaceResult_Struct CloseFurnaceResult = 1;  /* CloseFurnace Result.Payload. */
}

/* Parameters for OpenFurnace */
message OpenFurnace_Parameters {
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Request Request = 1;  /* Standard command request. */
}

/* Responses of OpenFurnace */
message OpenFurnace_Responses {
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Envelope Result = 1;  /* Standard command envelope. */
}

/* Parameters for CloseFurnace */
message CloseFurnace_Parameters {
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Request Request = 1;  /* Standard command request. */
}

/* Responses of CloseFurnace */
message CloseFurnace_Responses {
  sila2.org.tainstruments.sdt.furnacecontrol.v2.DataType_Envelope Result = 1;  /* Standard command envelope. */
}

/* Parameters for CurrentFurnaceStatus */
message Subscribe_CurrentFurnaceStatus_Parameters {
}

/* Responses of CurrentFurnaceStatus */
message Subscribe_CurrentFurnaceStatus_Responses {
  sila2.org.silastandard.String CurrentFurnaceStatus = 1;  /* GET /furnace/status body as UTF-8 JSON. Subscribeable; Get returns a live snapshot. */
}
