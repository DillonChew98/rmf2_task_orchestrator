[package]
name = "rmf2_task_orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
cel-interpreter = "0.10.0"
config = "0.15.19"
crossflow = { git = "https://github.com/junwei582/crossflow", branch="feat/grpc-tls", features = ["diagram", "grpc"] }
crossflow_diagram_editor = { git = "https://github.com/junwei582/crossflow", branch="feat/grpc-tls", features = ["frontend", "router"] }
dashmap = "6.1.0"
dotenvy = "0.15.7"
futures-lite = "2.6"
futures-timer = "3.0"
lapin = "3.7.2"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls-native-roots"] }
rumqttc = "0.25.1"
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["full"] }
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-opcua = { version = "0.19", default-features = false, features = ["client"] }
prost = "0.14"
prost-reflect = { version = "0.16" }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.27.0"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls-native-roots", "stream"] }
